name: ogamex-local-docker-dev

x-host-services: &host-services
  DB_HOST: ${LOCAL_DB_HOST:-host.docker.internal}
  DB_PORT: ${LOCAL_DB_PORT:-3306}
  DB_DATABASE: ${LOCAL_DB_DATABASE:-ogamex-test}
  DB_USERNAME: ${LOCAL_DB_USERNAME:-root}
  DB_PASSWORD: ${LOCAL_DB_PASSWORD:-}
  REDIS_HOST: ${LOCAL_REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${LOCAL_REDIS_PORT:-6379}
  REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-null}

x-service: &service
  image: ogamex-local-docker-dev:latest
  volumes:
    - ..:/var/www
    - ../php/local.ini:/usr/local/etc/php/conf.d/local.ini
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app-network

services:
  ogamex-app:
    <<: *service
    environment:
      CONTAINER_ROLE: app
      REVERB_HOST: ogamex-reverb
      <<: *host-services
    ports:
      - "${PHP_FPM_PORT:-9000}:9000"

  ogamex-scheduler:
    <<: *service
    environment:
      CONTAINER_ROLE: scheduler
      <<: *host-services
    depends_on:
      - ogamex-app

  ogamex-queue-worker:
    <<: *service
    profiles: ["queue"]
    environment:
      CONTAINER_ROLE: queue
      REVERB_HOST: ogamex-reverb
      QUEUE_WORKERS_LIGHT: ${QUEUE_WORKERS_LIGHT:-2}
      QUEUE_WORKERS_HEAVY: ${QUEUE_WORKERS_HEAVY:-3}
      <<: *host-services
    depends_on:
      - ogamex-app

  ogamex-reverb:
    <<: *service
    profiles: ["reverb"]
    environment:
      CONTAINER_ROLE: reverb
      <<: *host-services
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    depends_on:
      - ogamex-app

networks:
  app-network:
    driver: bridge
